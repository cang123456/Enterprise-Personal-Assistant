<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>企业助手 - Ollama Function Call Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f8f9fa; color: #202124; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 24px; background: #fff; border-bottom: 1px solid #dadce0;
    font-size: 15px; font-weight: 500;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px; max-width: 820px; width: 100%; margin: 0 auto;
  }
  .msg { margin-bottom: 14px; max-width: 80%; }
  .msg .bubble { padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .user { margin-left: auto; }
  .user .bubble { background: #1a73e8; color: #fff; }
  .bot .bubble { background: #fff; border: 1px solid #e0e0e0; }
  .meta { font-size: 12px; color: #5f6368; margin-top: 4px; }
  #inputbar {
    padding: 14px 24px; background: #fff; border-top: 1px solid #dadce0;
  }
  #inputbar form {
    max-width: 820px; margin: 0 auto; display: flex; gap: 8px;
  }
  #msg {
    flex: 1; padding: 10px 14px; border: 1px solid #dadce0; border-radius: 24px;
    font-size: 14px; outline: none;
  }
  #msg:focus { border-color: #1a73e8; }
  button {
    padding: 10px 20px; background: #1a73e8; color: #fff; border: none;
    border-radius: 24px; cursor: pointer; font-size: 14px;
  }
  button:disabled { background: #9bb9e8; cursor: not-allowed; }
  .hint { font-size: 12px; color: #5f6368; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<header>企业助手（本地 Ollama · Function Call）</header>
<div id="chat">
  <div class="msg bot"><div class="bubble">你好。我可以调用 query_user 和 calculator 工具。试试问："查一下 zhangsan 的用户信息" 或 "帮我算 12 乘以 8"。</div></div>
</div>
<div id="inputbar">
  <form id="form">
    <input id="msg" autocomplete="off" placeholder="输入你的问题…" />
    <button id="send" type="submit">发送</button>
  </form>
  <div class="hint">确保本地 Ollama 已启动，且已拉取支持 tools 的模型（如 qwen2.5）。</div>
</div>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="bubble"></div>';
  div.querySelector('.bubble').textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg('user', text);
  input.value = '';
  sendBtn.disabled = true;

  const pending = addMsg('bot', '思考中…');
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await resp.json();
    pending.querySelector('.bubble').textContent = data.reply || '(空回复)';
  } catch (err) {
    pending.querySelector('.bubble').textContent = '请求失败：' + err.message;
  } finally {
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
});
</script>
</body>
</html>
