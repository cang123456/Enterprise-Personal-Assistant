server.port=8080

# ====== 本地 Ollama ======
agent.ollama.base-url=http://localhost:11434
# 需要一个支持 tools 的模型，例如 qwen2.5:7b / qwen2.5:14b / llama3.1:8b
agent.ollama.model=qwen2.5:7b
# 最大工具调用轮次，防死循环
agent.ollama.max-rounds=8

# ====== 数据源：默认 H2 内存库（启动即跑，无需安装） ======
# MODE=MySQL 让 H2 兼容 MySQL 语法；DB_CLOSE_DELAY=-1 保持连接
#spring.datasource.url=jdbc:h2:mem:assistant;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
spring.datasource.url=jdbc:mysql://localhost:3306/assistant_demo?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456

# 启动时执行 schema.sql / data.sql
spring.sql.init.mode=always
spring.sql.init.encoding=utf-8

# H2 控制台：http://localhost:8080/h2-console （JDBC URL 填上面的 url）
spring.h2.console.enabled=true

# ====== 切到企业 MySQL 时，注释掉上面 H2 段，打开下面这段 ======
# spring.datasource.url=jdbc:mysql://localhost:3306/assistant_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.sql.init.mode=never   # MySQL 表结构用 doc/schema-mysql.sql 手动执行

# ====== MyBatis ======
mybatis.configuration.map-underscore-to-camel-case=true

# ====== 日志 ======
logging.level.com.xiaocang.toolcall_test=DEBUG
# 打印 SQL（调试时打开）
# logging.level.com.xiaocang.toolcall_test.mapper=DEBUG
